name: evpn

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10.1
    nokia_srsim:
      image: nokia_srsim:25.10.R2 # local image
      license: license-srsim25.txt # license file must be obtained from Nokia
    linux:
      image: ghcr.io/hellt/network-multitool

  nodes:
    dcgw1:
      kind: nokia_srsim
      type: sr-1
      startup-config: ./configs/dcgw1.partial.cfg
      components:
        - mda:
            - slot: 1
              type: me12-100gb-qsfp28

    dcgw2:
      kind: nokia_srsim
      type: sr-1
      startup-config: ./configs/dcgw2.partial.cfg
      components:
        - mda:
            - slot: 1
              type: me12-100gb-qsfp28

    spine1:
      kind: nokia_srlinux
      type: ixr-d3l
      startup-config: ./configs/spine1.cfg

    spine2:
      kind: nokia_srlinux
      type: ixr-d3l
      startup-config: ./configs/spine2.cfg

    leaf1:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: ./configs/leaf1.cfg

    leaf2:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: ./configs/leaf2.cfg

    leaf3:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: ./configs/leaf3.cfg

    leaf4:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: ./configs/leaf4.cfg

    client1:
      kind: linux
      binds:
        - ./configs/eth1.sh:/tmp/eth1.sh
      exec:
        - bash /tmp/eth1.sh
        - ip addr add 192.168.1.10/24 dev bond0.1

    client2:
      kind: linux
      binds:
        - ./configs/eth1.sh:/tmp/eth1.sh
      exec:
        - bash /tmp/eth1.sh
        - ip addr add 192.168.1.20/24 dev bond0.1

  links:
    - endpoints: ["dcgw1:1/1/c1/1", "spine1:e1-31"]
    - endpoints: ["dcgw1:1/1/c2/1", "spine2:e1-31"]
    - endpoints: ["dcgw2:1/1/c1/1", "spine1:e1-32"]
    - endpoints: ["dcgw2:1/1/c2/1", "spine2:e1-32"]

    - endpoints: ["spine1:e1-11", "leaf1:e1-51"]
    - endpoints: ["spine1:e1-12", "leaf2:e1-51"]
    - endpoints: ["spine1:e1-13", "leaf3:e1-51"]
    - endpoints: ["spine1:e1-14", "leaf4:e1-51"]

    - endpoints: ["spine2:e1-11", "leaf1:e1-52"]
    - endpoints: ["spine2:e1-12", "leaf2:e1-52"]
    - endpoints: ["spine2:e1-13", "leaf3:e1-52"]
    - endpoints: ["spine2:e1-14", "leaf4:e1-52"]

    - endpoints: ["leaf1:e1-1", "client1:eth1"]
    - endpoints: ["leaf2:e1-1", "client1:eth2"]
    - endpoints: ["leaf3:e1-1", "client2:eth1"]
    - endpoints: ["leaf4:e1-1", "client2:eth2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "router-mcp"
version = "0.1.0"
description = "MCP server for networking routers via gNMI"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pygnmi>=0.8.12",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
router-mcp = "router_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/router_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmcp"
version = "0.1.0"
description = "Multi-vendor MCP server for network routers"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pygnmi>=0.8.12",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
netmcp = "netmcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/netmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
